<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>열차 시간표</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title">
        <span class="title-icon">🚂</span>
        열차 시간표
      </h1>
    </div>
    <div class="header-right">
      <div id="person-legend" class="person-legend"></div>
      <button id="btn-edit-names" class="btn-icon" title="이름 편집">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Calendar Navigation -->
  <div class="calendar-nav">
    <button id="btn-today" class="btn-today">오늘</button>
    <button id="prev-month" class="btn-nav" aria-label="이전 달">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <h2 id="current-month" class="month-title">2026년 2월</h2>
    <button id="next-month" class="btn-nav" aria-label="다음 달">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
  </div>

  <!-- Calendar -->
  <div class="calendar-container">
    <div class="calendar-weekdays">
      <div class="weekday sunday">일</div>
      <div class="weekday">월</div>
      <div class="weekday">화</div>
      <div class="weekday">수</div>
      <div class="weekday">목</div>
      <div class="weekday">금</div>
      <div class="weekday saturday">토</div>
    </div>
    <div id="calendar-grid" class="calendar-grid"></div>
  </div>

  <!-- Schedule Modal -->
  <div id="schedule-modal" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-labelledby="modal-title">
      <div class="modal-header">
        <h3 id="modal-title">일정 추가</h3>
        <button id="btn-modal-close" class="btn-modal-close" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <form id="schedule-form">
          <!-- Date display -->
          <div class="form-group">
            <label class="form-label">날짜</label>
            <div id="modal-date" class="date-display"></div>
          </div>

          <!-- Person selector -->
          <div class="form-group">
            <label class="form-label">사람</label>
            <div id="person-selector" class="person-selector"></div>
          </div>

          <!-- Time inputs -->
          <div class="form-group form-row">
            <div class="form-col">
              <label class="form-label" for="start-time">
                <span class="label-icon">🚉</span> 승차 시간
              </label>
              <input type="time" id="start-time" class="form-input" required>
            </div>
            <div class="form-col">
              <label class="form-label" for="end-time">
                <span class="label-icon">🏁</span> 하차 시간
              </label>
              <input type="time" id="end-time" class="form-input" required>
            </div>
          </div>

          <!-- Description -->
          <div class="form-group">
            <label class="form-label" for="description">메모</label>
            <input type="text" id="description" class="form-input" placeholder="선택사항">
          </div>

          <!-- Action buttons -->
          <div class="form-actions">
            <button type="button" id="btn-delete" class="btn btn-delete hidden">삭제</button>
            <div class="form-actions-right">
              <button type="button" id="btn-cancel" class="btn btn-cancel">취소</button>
              <button type="submit" class="btn btn-save">저장</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Person Name Edit Modal -->
  <div id="person-modal" class="modal-overlay hidden">
    <div class="modal modal-sm" role="dialog" aria-labelledby="person-modal-title">
      <div class="modal-header">
        <h3 id="person-modal-title">이름 편집</h3>
        <button id="btn-person-modal-close" class="btn-modal-close" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <form id="person-form">
          <div id="person-name-inputs" class="person-name-inputs"></div>
          <div class="form-actions">
            <div class="form-actions-right">
              <button type="button" id="btn-person-cancel" class="btn btn-cancel">취소</button>
              <button type="submit" class="btn btn-save">저장</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Day Detail Modal (for dates with many schedules) -->
  <div id="day-modal" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-labelledby="day-modal-title">
      <div class="modal-header">
        <h3 id="day-modal-title">일정 목록</h3>
        <button id="btn-day-modal-close" class="btn-modal-close" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <div id="day-schedule-list" class="day-schedule-list"></div>
        <div class="form-actions">
          <div class="form-actions-right">
            <button type="button" id="btn-day-add" class="btn btn-save">+ 일정 추가</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
